<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F8FAFC;--ink:#0F172A;--text:#1E293B;--muted:#64748B;--line:#E2E8F0;--blue:#2563EB;--amber:#F97316;--green:#059669}
*{box-sizing:border-box}html,body{margin:0}
body{width:1080px;height:1440px;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans","Noto Sans SC","PingFang SC",sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.card{width:1080px;height:1440px;padding:96px 84px;display:flex;flex-direction:column;position:relative}
.eyebrow{font:600 22px/1 "JetBrains Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--blue)}
h1{font-size:88px;line-height:1.1;letter-spacing:-.02em;color:var(--ink);margin:28px 0 30px;font-weight:700}
h2{font-size:64px;line-height:1.15;letter-spacing:-.02em;color:var(--ink);margin:24px 0 28px;font-weight:700}
p{font-size:32px;line-height:1.5;color:var(--muted);margin:0 0 22px}
.mono{font-family:"JetBrains Mono",monospace}
.foot{position:absolute;left:84px;right:84px;bottom:72px;display:flex;justify-content:space-between;font:500 24px "JetBrains Mono",monospace;color:#94A3B8}
.foot b{color:var(--ink)}
.pill{display:inline-flex;align-items:center;gap:14px;background:#fff;border:2px solid var(--line);border-radius:18px;padding:18px 24px;margin:0 0 16px;font-size:30px;color:var(--ink)}
.k{width:56px;height:56px;border-radius:12px;display:grid;place-items:center;font:600 22px "JetBrains Mono",monospace;flex:none}
.k1{background:#DBEAFE;color:var(--blue)}.k2{background:#FFEDD5;color:var(--amber)}.k3{background:#D1FAE5;color:var(--green)}
.pain{background:#fff;border-left:8px solid var(--amber);border-radius:0 20px 20px 0;padding:28px 34px;margin:0 0 22px;font-size:34px;line-height:1.45}
.pain b{color:var(--ink);display:block;font-size:40px;margin-bottom:6px}
pre{background:var(--ink);color:#E2E8F0;font:27px/1.6 "JetBrains Mono",monospace;padding:30px 34px;border-radius:22px;margin:0 0 22px;white-space:pre-wrap;word-break:break-all}
pre .c{color:#94A3B8}pre .g{color:#86EFAC}
.bar{background:#1E1E2E;border-radius:18px;padding:26px 30px;font:600 34px "JetBrains Mono",monospace;color:#CDD6F4;margin:26px 0}
.bar .b{color:#89B4FA}.bar .a{color:#F9E2AF}.bar .g{color:#A6E3A1}
.big{font:700 120px/1 "JetBrains Mono",monospace;color:var(--ink);letter-spacing:-.03em}
img.shot{width:100%;border-radius:22px;border:2px solid var(--line)}
.num{display:flex;gap:18px;margin:10px 0 0}.num>div{flex:1;background:#fff;border:2px solid var(--line);border-radius:20px;padding:24px 18px;text-align:center}
.num .v{font:700 64px "JetBrains Mono",monospace;color:var(--ink)}.num .l{font-size:22px;color:var(--muted);line-height:1.3;margin-top:8px}
</style></head><body><div class="card"><div class="eyebrow">从这里开始</div>
<h2>三个仓库，一个网站。</h2>
<div class="pill" style="width:100%"><span class="k k2">FM</span><span class="mono">github.com/xiaolongnk/fleetmux</span></div>
<div class="pill" style="width:100%"><span class="k k3">TA</span><span class="mono">github.com/xiaolongnk/tmux-agent-status</span></div>
<div class="pill" style="width:100%"><span class="k k1">SH</span><span class="mono">github.com/xiaolongnk/SuperHarness</span></div>
<div style="margin-top:40px"><div class="big">xiaolongnk<br>.github.io</div><p style="margin-top:22px">完整介绍、中英文都有。在手机上看这些 agent？<b class="mono" style="color:var(--ink)">termio.xyz</b> 用的是同一个探针。</p></div><div class="foot"><span><b>xiaolongnk.github.io</b></span><span>6/6</span></div></div></body></html>
